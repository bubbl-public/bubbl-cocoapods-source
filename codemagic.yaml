workflows:
  cocoapods-check:
    name: CocoaPods Check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - cocoapods-release
      xcode: latest
      cocoapods: 1.16.2
    scripts:
      - name: Install release tooling
        script: |
          npm install --no-audit --no-fund
      - name: Validate release config
        script: |
          npm run release:check
          npm run readiness
      - name: Swift tests
        script: |
          swift test --package-path ios --scratch-path /tmp/bubbl-renewed-sdk-ios-build
      - name: CocoaPods lint
        script: |
          sh scripts/cocoapods-lint.sh

  cocoapods-release:
    name: CocoaPods Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - cocoapods-release
      xcode: latest
      cocoapods: 1.16.2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "*"
          include: true
    scripts:
      - name: Install release tooling
        script: |
          npm install --no-audit --no-fund
      - name: Validate release config
        script: |
          npm run release:check
          npm run readiness
      - name: Swift tests
        script: |
          swift test --package-path ios --scratch-path /tmp/bubbl-renewed-sdk-ios-build
      - name: CocoaPods lint
        script: |
          sh scripts/cocoapods-lint.sh
      - name: Publish CocoaPods trunk
        script: |
          sh scripts/cocoapods-publish.sh
