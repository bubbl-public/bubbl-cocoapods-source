name: SDK Release

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.5'
  DRY_RUN: ${{ github.event_name != 'push' }}
  BUBBL_PUBLIC_REGISTRY_RELEASE: ${{ vars.BUBBL_PUBLIC_REGISTRY_RELEASE || 'false' }}
  BUBBL_COCOAPODS_TRUNK_RELEASE: ${{ vars.BUBBL_COCOAPODS_TRUNK_RELEASE || 'false' }}

jobs:
  validate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      public_registry_release: ${{ steps.mode.outputs.public_registry_release }}
      cocoapods_trunk_release: ${{ steps.mode.outputs.cocoapods_trunk_release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
            echo "Release tag '${GITHUB_REF_NAME}' must exactly match package version '${VERSION}'."
            exit 1
          fi

      - id: mode
        shell: bash
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          PUBLIC_REGISTRY_RELEASE=false
          COCOAPODS_TRUNK_RELEASE=false

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${BUBBL_PUBLIC_REGISTRY_RELEASE}" = "true" ]; then
            PUBLIC_REGISTRY_RELEASE=true
          fi

          if [ "${PUBLIC_REGISTRY_RELEASE}" = "true" ] && \
             [ "${BUBBL_COCOAPODS_TRUNK_RELEASE}" = "true" ]; then
            COCOAPODS_TRUNK_RELEASE=true
          fi

          echo "public_registry_release=${PUBLIC_REGISTRY_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "cocoapods_trunk_release=${COCOAPODS_TRUNK_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Public registry release: ${PUBLIC_REGISTRY_RELEASE}"
          echo "CocoaPods trunk release: ${COCOAPODS_TRUNK_RELEASE}"

      - run: npm run test:contracts
      - run: npm run test:wrappers
      - run: npm run test:rn
      - run: npm run release:check
      - run: npm run readiness:strict

  android-checks:
    name: Android checks
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Test and publish locally
        run: |
          gradle -p android testDebugUnitTest --no-daemon
          gradle -p android publishToMavenLocal --no-daemon

  android-publish:
    name: Android Maven Central
    needs:
      - validate
      - android-checks
    if: needs.validate.outputs.public_registry_release == 'true'
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Prepare signing key
        shell: bash
        env:
          MAVEN_CENTRAL_SIGNING_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          MAVEN_CENTRAL_SIGNING_KEY_B64: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY_B64 }}
        run: |
          if [ -n "${MAVEN_CENTRAL_SIGNING_KEY_B64}" ]; then
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<EOF" >> "$GITHUB_ENV"
            echo "${MAVEN_CENTRAL_SIGNING_KEY_B64}" | base64 --decode >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          elif [ -n "${MAVEN_CENTRAL_SIGNING_KEY}" ]; then
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<EOF" >> "$GITHUB_ENV"
            echo "${MAVEN_CENTRAL_SIGNING_KEY}" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          else
            echo "Missing MAVEN_CENTRAL_SIGNING_KEY or MAVEN_CENTRAL_SIGNING_KEY_B64."
            exit 1
          fi

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
        run: gradle -p android publishAndReleaseToMavenCentral --no-daemon

  ios-build:
    name: iOS SPM and XCFramework
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift tests
        run: swift test --package-path ios --scratch-path /tmp/bubbl-renewed-sdk-ios-build

      - name: Build XCFramework
        run: scripts/build-ios-xcframework.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Bubbl.xcframework-${{ needs.validate.outputs.version }}
          path: ios/build/Bubbl.xcframework

  cocoapods-lint:
    name: CocoaPods lint
    needs:
      - validate
      - ios-build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install CocoaPods
        run: gem install cocoapods -v 1.16.2

      - name: Lint podspecs
        run: |
          pod lib lint ios/BubblSDK.podspec --allow-warnings --verbose
          pod lib lint ios/Bubbl-Sdk.podspec --include-podspecs=ios/BubblSDK.podspec --allow-warnings --verbose

  cocoapods-publish:
    name: CocoaPods trunk
    needs:
      - validate
      - cocoapods-lint
    if: needs.validate.outputs.cocoapods_trunk_release == 'true'
    runs-on: macos-15
    environment: cocoapods-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install CocoaPods
        run: gem install cocoapods -v 1.16.2

      - name: Publish podspecs
        env:
          BUBBL_PUBLIC_REGISTRY_RELEASE: ${{ env.BUBBL_PUBLIC_REGISTRY_RELEASE }}
          BUBBL_COCOAPODS_TRUNK_RELEASE: ${{ env.BUBBL_COCOAPODS_TRUNK_RELEASE }}
          BUBBL_COCOAPODS_SOURCE_URL: ${{ vars.BUBBL_COCOAPODS_SOURCE_URL }}
          BUBBL_COCOAPODS_SOURCE_TAG: ${{ needs.validate.outputs.version }}
          BUBBL_COCOAPODS_ALIAS_RELEASE: ${{ vars.BUBBL_COCOAPODS_ALIAS_RELEASE || 'false' }}
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: scripts/cocoapods-publish.sh

  flutter-checks:
    name: Flutter checks
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Analyze, test, and dry-run publish
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter pub publish --dry-run

  flutter-publish:
    name: Flutter pub.dev
    needs:
      - validate
      - flutter-checks
    if: needs.validate.outputs.public_registry_release == 'true'
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: flutter
      environment: pub.dev

  react-native-pack:
    name: React Native pack
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Pack
        working-directory: react-native
        run: |
          npm pack --dry-run
          npm publish --dry-run --access public

  react-native-publish:
    name: React Native npm
    needs:
      - validate
      - react-native-pack
    if: needs.validate.outputs.public_registry_release == 'true'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Publish
        working-directory: react-native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
