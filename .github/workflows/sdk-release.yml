name: SDK Release

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Optional public publish target for manual runs
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - flutter
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.5'
  DRY_RUN: ${{ github.event_name != 'push' }}
  BUBBL_PUBLIC_REGISTRY_RELEASE: ${{ vars.BUBBL_PUBLIC_REGISTRY_RELEASE || 'false' }}

jobs:
  validate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      public_registry_release: ${{ steps.mode.outputs.public_registry_release }}
      publish_target: ${{ steps.mode.outputs.publish_target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          REF_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${REF_VERSION}" != "${VERSION}" ]; then
            echo "Release tag '${GITHUB_REF_NAME}' must exactly match package version '${VERSION}'."
            exit 1
          fi

      - id: mode
        shell: bash
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          PUBLISH_TARGET: ${{ inputs.publish_target || vars.BUBBL_SDK_RELEASE_TARGET || 'all' }}
        run: |
          PUBLIC_REGISTRY_RELEASE=false

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${BUBBL_PUBLIC_REGISTRY_RELEASE}" = "true" ]; then
            PUBLIC_REGISTRY_RELEASE=true
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && \
             [ "${PUBLISH_TARGET}" = "flutter" ] && \
             [ "${BUBBL_PUBLIC_REGISTRY_RELEASE}" = "true" ]; then
            PUBLIC_REGISTRY_RELEASE=true
          fi

          echo "public_registry_release=${PUBLIC_REGISTRY_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "publish_target=${PUBLISH_TARGET}" >> "$GITHUB_OUTPUT"
          echo "Public registry release: ${PUBLIC_REGISTRY_RELEASE}"
          echo "iOS SDK/CocoaPods release: Codemagic ios_sdk_release via cm-ios-sdk-* tag"
          echo "Publish target: ${PUBLISH_TARGET}"

      - run: npm run test:contracts
      - run: npm run test:wrappers
      - run: npm run test:rn
      - run: npm run release:check
      - run: npm run readiness:strict

  android-checks:
    name: Android checks
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Test and publish locally
        run: |
          gradle -p android testDebugUnitTest --no-daemon
          gradle -p android publishToMavenLocal --no-daemon

  ios-codemagic-trigger:
    name: Codemagic iOS SDK build
    needs: validate
    if: needs.validate.outputs.public_registry_release == 'true' && needs.validate.outputs.publish_target != 'flutter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push Codemagic release tag
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          tag="cm-ios-sdk-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$tag" "$GITHUB_SHA"
          git push origin ":refs/tags/$tag" || true
          git push origin "refs/tags/$tag"

      - name: Trigger Codemagic iOS SDK release
        env:
          CODEMAGIC_API_KEY: ${{ secrets.CODEMAGIC_API_KEY }}
          CODEMAGIC_APP_ID: ${{ vars.CODEMAGIC_SDK_APP_ID }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${CODEMAGIC_API_KEY:-}" ]; then
            echo "Missing CODEMAGIC_API_KEY secret."
            exit 1
          fi
          if [ -z "${CODEMAGIC_APP_ID:-}" ]; then
            echo "Missing CODEMAGIC_SDK_APP_ID variable."
            exit 1
          fi

          payload="$(node -e 'console.log(JSON.stringify({
            appId: process.env.CODEMAGIC_APP_ID,
            workflowId: "ios_sdk_release",
            tag: `cm-ios-sdk-${process.env.VERSION}`,
            labels: ["sdk", "ios", process.env.VERSION, "github-actions"]
          }))')"
          response="$(curl -fsS \
            -H "Content-Type: application/json" \
            -H "x-auth-token: ${CODEMAGIC_API_KEY}" \
            --data "$payload" \
            -X POST https://api.codemagic.io/builds)"
          echo "$response"
          node -e 'const response = JSON.parse(process.argv[1]); if (!response.buildId) { throw new Error("Codemagic did not return buildId"); }' "$response"

  android-publish:
    name: Android Maven Central
    needs:
      - validate
      - android-checks
    if: needs.validate.outputs.public_registry_release == 'true' && needs.validate.outputs.publish_target != 'flutter'
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Prepare signing key
        shell: bash
        env:
          MAVEN_CENTRAL_SIGNING_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          MAVEN_CENTRAL_SIGNING_KEY_B64: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY_B64 }}
        run: |
          if [ -n "${MAVEN_CENTRAL_SIGNING_KEY_B64}" ]; then
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<EOF" >> "$GITHUB_ENV"
            echo "${MAVEN_CENTRAL_SIGNING_KEY_B64}" | base64 --decode >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          elif [ -n "${MAVEN_CENTRAL_SIGNING_KEY}" ]; then
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<EOF" >> "$GITHUB_ENV"
            echo "${MAVEN_CENTRAL_SIGNING_KEY}" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          else
            echo "Missing MAVEN_CENTRAL_SIGNING_KEY or MAVEN_CENTRAL_SIGNING_KEY_B64."
            exit 1
          fi

      - name: Publish to Maven Central
        id: publish_android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          gradle -p android publishAndReleaseToMavenCentral --no-daemon
          echo "duration=$(($(date +%s) - started_at))" >> "$GITHUB_OUTPUT"
          echo "version=${{ needs.validate.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CI_PROVIDER: GitHub Actions
          STATUS: ${{ job.status }}
          TITLE: Bubbl Android SDK ${{ needs.validate.outputs.version }} Maven Central release
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          VERSION_COMPILED: ${{ steps.publish_android.outputs.version }}
          DURATION_SECONDS: ${{ steps.publish_android.outputs.duration }}
          TESTS_PASSED: |-
            - Contract tests (`npm run test:contracts`)
            - Wrapper tests (`npm run test:wrappers`)
            - React Native surface tests (`npm run test:rn`)
            - Release config check (`npm run release:check`)
            - Strict readiness check (`npm run readiness:strict`)
            - Android JVM tests (`gradle -p android testDebugUnitTest`)
            - Android Maven local publish (`gradle -p android publishToMavenLocal`)
        run: node scripts/notify-slack.mjs

  flutter-checks:
    name: Flutter checks
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Trust Flutter SDK checkout
        run: git config --global --add safe.directory "$FLUTTER_ROOT"

      - name: Analyze, test, and dry-run publish
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter pub publish --dry-run

  flutter-publish:
    name: Flutter pub.dev
    needs:
      - validate
      - flutter-checks
    if: needs.validate.outputs.public_registry_release == 'true' && (needs.validate.outputs.publish_target == 'all' || needs.validate.outputs.publish_target == 'flutter')
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: dart-lang/setup-dart@v1

      - name: Trust Flutter SDK checkout
        run: git config --global --add safe.directory "$FLUTTER_ROOT"

      - name: Publish to pub.dev
        id: publish_flutter
        working-directory: flutter
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          PACKAGE_VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          if curl -fsS "https://pub.dev/api/packages/bubbl_flutter_sdk/versions/${PACKAGE_VERSION}" >/dev/null; then
            echo "bubbl_flutter_sdk ${PACKAGE_VERSION} is already published; skipping pub.dev publish."
            echo "duration=$(($(date +%s) - started_at))" >> "$GITHUB_OUTPUT"
            echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          flutter pub get
          flutter pub publish --dry-run
          flutter pub publish --force
          echo "duration=$(($(date +%s) - started_at))" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CI_PROVIDER: GitHub Actions
          STATUS: ${{ job.status }}
          TITLE: Bubbl Flutter SDK ${{ needs.validate.outputs.version }} pub.dev release
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          VERSION_COMPILED: ${{ steps.publish_flutter.outputs.version }}
          DURATION_SECONDS: ${{ steps.publish_flutter.outputs.duration }}
          TESTS_PASSED: |-
            - Contract tests (`npm run test:contracts`)
            - Wrapper tests (`npm run test:wrappers`)
            - React Native surface tests (`npm run test:rn`)
            - Release config check (`npm run release:check`)
            - Strict readiness check (`npm run readiness:strict`)
            - Flutter pub get/analyze/test
            - Flutter pub publish dry-run
        run: node scripts/notify-slack.mjs

  react-native-pack:
    name: React Native pack
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Pack
        working-directory: react-native
        run: |
          npm pack --dry-run
          npm publish --dry-run --access public

  react-native-publish:
    name: React Native npm
    needs:
      - validate
      - react-native-pack
    if: needs.validate.outputs.public_registry_release == 'true' && needs.validate.outputs.publish_target != 'flutter'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Publish
        id: publish_rn
        working-directory: react-native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "@bubblsdk/react-native-sdk@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "@bubblsdk/react-native-sdk ${PACKAGE_VERSION} is already published; skipping npm publish."
            echo "duration=$(($(date +%s) - started_at))" >> "$GITHUB_OUTPUT"
            echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm publish --access public
          echo "duration=$(($(date +%s) - started_at))" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CI_PROVIDER: GitHub Actions
          STATUS: ${{ job.status }}
          TITLE: Bubbl React Native SDK ${{ needs.validate.outputs.version }} npm release
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          VERSION_COMPILED: ${{ steps.publish_rn.outputs.version }}
          DURATION_SECONDS: ${{ steps.publish_rn.outputs.duration }}
          TESTS_PASSED: |-
            - Contract tests (`npm run test:contracts`)
            - Wrapper tests (`npm run test:wrappers`)
            - React Native surface tests (`npm run test:rn`)
            - Release config check (`npm run release:check`)
            - Strict readiness check (`npm run readiness:strict`)
            - React Native npm pack dry-run
            - React Native npm publish dry-run
        run: node scripts/notify-slack.mjs
